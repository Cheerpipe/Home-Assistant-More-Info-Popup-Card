# Development instance: demo entities. The card is registered as a dashboard
# resource by dev/onboard.mjs (like HACS does), not with extra_module_url:
# HA loads a scoped custom element registry polyfill and resources loaded
# before it can end up outside the registry HA looks cards up in.
default_config:

demo:

logger:
  default: warning

# One-shot entities for the state card `trigger` control.
script:
  movie_night:
    alias: Movie night
    icon: mdi:movie-open
    sequence:
      - delay: 5
  announce:
    alias: Announce
    icon: mdi:bullhorn
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
    sequence:
      - delay: 1

automation:
  - id: good_morning
    alias: Good morning
    triggers:
      - trigger: time
        at: "07:00:00"
    actions:
      - delay: 1
